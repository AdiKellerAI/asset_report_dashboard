<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asset Report Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-raised);
      padding: 32px 28px;
    }
    .login-card h1 {
      margin: 0 0 6px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--ink);
    }
    .login-card p.hint {
      margin: 0 0 24px;
      color: var(--ink-muted);
      font-size: 0.85rem;
    }
    .login-card input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--ink);
      padding: 12px 14px;
      font-size: 0.95rem;
    }
    .login-card input[type="password"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-ring);
    }
    .login-card button {
      width: 100%;
      margin-top: 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .login-card button:hover { background: var(--accent-strong); }
    .login-error {
      margin: -8px 0 16px;
      color: #e5484d;
      font-size: 0.85rem;
    }
    .passkey-button {
      width: 100%;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .passkey-button:hover { border-color: var(--accent); }
    .passkey-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      color: var(--ink-muted);
      font-size: 0.8rem;
    }
    .passkey-divider::before, .passkey-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1>Asset Report Dashboard</h1>
      <p class="hint">Enter the password to continue.</p>
      {% if error %}
      <p class="login-error">Incorrect password.</p>
      {% endif %}
      {% if has_passkeys %}
      <button type="button" class="passkey-button" id="passkey-login-btn">Continue with Face ID / Touch ID</button>
      <p class="login-error" id="passkey-error" style="display:none"></p>
      <div class="passkey-divider">or</div>
      {% endif %}
      <form method="post" action="/login">
        <input type="password" name="password" autofocus required>
        <button type="submit">Enter</button>
      </form>
    </div>
  </div>
  {% if has_passkeys %}
  <script>
    (function () {
      const btn = document.getElementById("passkey-login-btn");
      const errorEl = document.getElementById("passkey-error");

      if (!window.PublicKeyCredential || !PublicKeyCredential.parseRequestOptionsFromJSON) {
        btn.style.display = "none";
        return;
      }

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.style.display = "block";
      }

      btn.addEventListener("click", async function () {
        errorEl.style.display = "none";
        try {
          const beginResp = await fetch("/webauthn/login/begin", { method: "POST" });
          if (!beginResp.ok) {
            showError("No passkey is set up yet.");
            return;
          }
          const optionsJson = await beginResp.json();
          const requestOptions = PublicKeyCredential.parseRequestOptionsFromJSON(optionsJson);
          const credential = await navigator.credentials.get({ publicKey: requestOptions });

          const finishResp = await fetch("/webauthn/login/finish", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(credential.toJSON()),
          });
          if (!finishResp.ok) {
            showError("Passkey login failed. Use your password instead.");
            return;
          }
          const result = await finishResp.json();
          window.location = result.redirect || "/";
        } catch (err) {
          if (err.name !== "NotAllowedError") {
            showError("Passkey login failed. Use your password instead.");
          }
        }
      });
    })();
  </script>
  {% endif %}
</body>
</html>
