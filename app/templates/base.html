<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Asset Report Dashboard{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="page-header">
    <h1>Asset Report Dashboard</h1>
    <nav class="main-nav">
      <a href="/" class="{{ 'active' if active_nav == 'dashboard' else '' }}">Dashboard</a>
      <a href="/trends" class="{{ 'active' if active_nav == 'trends' else '' }}">Trends</a>
    </nav>
  </header>

  {% block content %}{% endblock %}

  {% block scripts %}{% endblock %}
</body>
</html>
