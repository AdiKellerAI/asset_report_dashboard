<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Asset Report Dashboard{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="page-header">
    <h1>Asset Report Dashboard</h1>
    <div class="header-right">
      <nav class="main-nav">
        <a href="/" class="{{ 'active' if active_nav == 'dashboard' else '' }}">Dashboard</a>
        <a href="/trends" class="{{ 'active' if active_nav == 'trends' else '' }}">Trends</a>
      </nav>
      <button type="button" id="currency-toggle" class="currency-toggle" aria-pressed="false">$ USD</button>
    </div>
  </header>

  {% block content %}{% endblock %}

  <script>
    // Site-wide USD/NIS display toggle (dev-plan.md sec 15) - storage and
    // all math stay USD-only; this only re-renders already-rendered figures
    // client-side, no page reload. Every money figure is a `.money` span
    // carrying its raw USD value in `data-usd` (see the `money` Jinja
    // filter); charts push themselves into `window.moneyCharts` and call
    // `window.formatMoney` from their tick/tooltip callbacks so they flip
    // too - reformatting the label is enough, no need to rescale the data,
    // since it's a linear axis either way.
    window.FX_RATE_USD_TO_ILS = {{ usd_to_ils_rate|tojson }};
    window.currentCurrency = "USD";
    window.moneyCharts = [];

    window.formatMoney = function (usdValue) {
      var formatted = Number(usdValue).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (window.currentCurrency === "NIS") {
        var nis = usdValue * window.FX_RATE_USD_TO_ILS;
        return nis.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₪";
      }
      return formatted + " $";
    };

    function refreshMoneyDisplays() {
      document.querySelectorAll(".money").forEach(function (el) {
        el.textContent = window.formatMoney(parseFloat(el.getAttribute("data-usd")));
      });
      window.moneyCharts.forEach(function (chart) {
        chart.update();
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      var btn = document.getElementById("currency-toggle");
      if (!btn) return;
      btn.addEventListener("click", function () {
        window.currentCurrency = window.currentCurrency === "USD" ? "NIS" : "USD";
        btn.textContent = window.currentCurrency === "USD" ? "$ USD" : "₪ NIS";
        btn.setAttribute("aria-pressed", window.currentCurrency === "NIS");
        refreshMoneyDisplays();
      });
    });
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
