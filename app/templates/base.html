<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ "Asset Report Dashboard"|t }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="page-header" dir="ltr">
    <!-- Deliberately LTR regardless of page language (Adi's request): the
         nav order and the currency/language control's position shouldn't
         mirror just because the page content does - only the words inside
         them translate. -->
    <nav class="main-nav">
      <a href="/" class="{{ 'active' if active_nav == 'dashboard' else '' }}">{{ "Dashboard"|t }}</a>
      <a href="/trends" class="{{ 'active' if active_nav == 'trends' else '' }}">{{ "Trends"|t }}</a>
      <a href="/manage" class="{{ 'active' if active_nav == 'manage' else '' }}">{{ "Manage"|t }}</a>
      <a href="/tables" class="{{ 'active' if active_nav == 'tables' else '' }}">{{ "Tables"|t }}</a>
    </nav>
    <div class="currency-widget">
      <div class="lang-switch" role="group" aria-label="Currency / language">
        <a href="/set-language/en" class="lang-switch-option {{ 'active' if lang == 'en' }}">$</a>
        <a href="/set-language/he" class="lang-switch-option {{ 'active' if lang == 'he' }}">₪</a>
      </div>
      {% if lang == "he" %}
      <span class="fx-rate-note">1 $ = {{ "%.2f"|format(usd_to_ils_rate) }} ₪</span>
      {% endif %}
    </div>
  </header>

  {% block content %}{% endblock %}

  <script>
    // Chart.js tick/tooltip labels are JS-rendered, so they need their own
    // formatter - everything else (tables, cards) is server-rendered
    // already in the right currency by the `money` Jinja filter. The
    // language/currency mode itself is set by a full page reload
    // (app/routes/language.py), not client-side, since a real RTL flip
    // needs a fresh render.
    window.CURRENT_LANG = {{ lang|tojson }};
    window.FX_RATE_USD_TO_ILS = {{ usd_to_ils_rate|tojson }};

    window.formatMoney = function (usdValue) {
      if (window.CURRENT_LANG === "he") {
        var nis = usdValue * window.FX_RATE_USD_TO_ILS;
        return nis.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₪";
      }
      return Number(usdValue).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " $";
    };
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
